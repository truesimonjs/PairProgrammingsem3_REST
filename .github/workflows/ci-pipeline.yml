on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Hent kildekode
      uses: actions/checkout@v4

    - name: Opsæt .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Byg koden
      run: dotnet build --no-restore

    - name: Kør Unit Tests
      run: dotnet test --no-build --verbosity normal
  ##
    - name: Start API i baggrunden
      # Skift stien ud med stien til jeres .csproj fil for API'et
      run: dotnet run --project src/PairProgrammingsem3_REST.csproj &
      env:
        ASPNETCORE_URLS: http://localhost:7198

    - name: Vent på at API'et er klar
      run: sleep 10 # Giver API'et tid til at starte op

    - name: Installer Newman (Postman CLI)
      run: npm install -g newman

    - name: Kør Postman Tests
      # Skift stien ud til jeres eksporterede JSON-fil. 
      # Overvej at sende baseUrl med som en variabel, hvis jeres tests kræver det.
      run: newman run postman-tests/pairprogrammingtest1.json --env-var "baseurl=http://localhost:7198" 
      

